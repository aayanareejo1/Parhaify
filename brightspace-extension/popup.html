<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brightspace Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 16px;
      font-size: 13px;
    }

    h1 { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 3px; }
    .subtitle { font-size: 11px; color: #64748b; margin-bottom: 16px; }

    .stats {
      background: #1a1f2e;
      border: 1px solid #1e2433;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: none;
      gap: 0;
    }
    .stats-row { display: flex; gap: 20px; margin-bottom: 4px; }
    .stat-num { font-size: 22px; font-weight: 700; color: #6366f1; line-height: 1; }
    .stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }
    .last-scan { font-size: 10px; color: #475569; margin-top: 6px; }

    .status { font-size: 11px; color: #64748b; margin-bottom: 10px; min-height: 15px; white-space: pre-wrap; word-break: break-all; }
    .status.error { color: #f87171; }
    .status.success { color: #4ade80; }
    .status.info { color: #94a3b8; }

    .btn {
      width: 100%; padding: 9px 14px; border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.15s;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #4f51d0; }
    .btn-primary:disabled { background: #2d3748; color: #475569; cursor: not-allowed; }
    .btn-secondary { background: #1a1f2e; color: #94a3b8; border: 1px solid #2d3748; }
    .btn-secondary:hover:not(:disabled) { background: #242a3a; }
    .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

    .separator { border: none; border-top: 1px solid #1a1f2e; margin: 12px 0; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .toggle-row .toggle-label { font-size: 11px; color: #94a3b8; }
    .switch { position: relative; width: 34px; height: 19px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #2d3748; border-radius: 999px; transition: background 0.15s;
    }
    .slider::before {
      content: ''; position: absolute; width: 15px; height: 15px;
      left: 2px; top: 2px; background: #fff; border-radius: 50%;
      transition: transform 0.15s;
    }
    input:checked + .slider { background: #6366f1; }
    input:checked + .slider::before { transform: translateX(15px); }
    .auto-status { font-size: 10px; color: #475569; margin-bottom: 10px; }

    label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%; padding: 7px 10px;
      background: #1a1f2e; border: 1px solid #2d3748; border-radius: 7px;
      color: #e2e8f0; font-size: 11px; outline: none;
    }
    input[type="text"]:focus { border-color: #6366f1; }

    .spinner {
      width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Brightspace Sync</h1>
  <p class="subtitle">Import courses &amp; assignments into Parhaify</p>

  <div id="stats" class="stats">
    <div class="stats-row">
      <div>
        <div class="stat-num" id="courseCount">0</div>
        <div class="stat-label">Courses</div>
      </div>
      <div>
        <div class="stat-num" id="assignCount">0</div>
        <div class="stat-label">Assignments</div>
      </div>
    </div>
    <div class="last-scan" id="lastScan"></div>
  </div>

  <div id="status" class="status"></div>

  <button id="scanBtn" class="btn btn-primary">Scan Brightspace</button>
  <button id="syncBtn" class="btn btn-secondary" disabled>Sync to Parhaify</button>

  <hr class="separator" />

  <div class="toggle-row">
    <span class="toggle-label">Auto-sync in the background</span>
    <label class="switch">
      <input type="checkbox" id="autoSyncToggle" checked />
      <span class="slider"></span>
    </label>
  </div>
  <div class="auto-status" id="autoStatus"></div>

  <hr class="separator" />

  <label for="bsUrl">Brightspace URL</label>
  <input type="text" id="bsUrl" placeholder="https://yourschool.brightspace.com" />

  <script src="popup.js"></script>
</body>
</html>
